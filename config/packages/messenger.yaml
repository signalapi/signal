framework:
    messenger:
        failure_transport: failed

        transports:
            async: '%env(MESSENGER_TRANSPORT_DSN)%'
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            App\Message\RunFlowMessage: async
            App\Message\RunFlowGroupMessage: async
            # Sending shares the run queue: a slow Slack call must never block a
            # run, and the transport's retry gives failed deliveries a second go.
            App\Message\SendNotificationMessage: async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
