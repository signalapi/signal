security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_users:
            entity:
                class: App\Entity\User
                property: email
        # Platform operators live in their own table: a merchant signup can
        # never become an admin, and admin credentials never work on /login.
        admin_users:
            entity:
                class: App\Entity\AdminUser
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # Programmatic API + MCP server — stateless, bearer-token authenticated.
        api:
            pattern: ^/(api|mcp)
            stateless: true
            provider: app_users
            custom_authenticators:
                - App\Security\ApiTokenAuthenticator

        # Super admin area — its own user table (AdminUser) and its own token
        # context. invalidate_session is off on BOTH firewalls because they
        # share the PHP session: invalidating it on logout would also destroy
        # the other area's token. Each logout only clears its own context.
        admin:
            pattern: ^/admin
            lazy: true
            provider: admin_users
            context: admin
            user_checker: App\Security\ActiveUserChecker
            form_login:
                login_path: admin_login
                check_path: admin_login
                default_target_path: admin_dashboard
                enable_csrf: true
            logout:
                path: admin_logout
                target: admin_login
                invalidate_session: false

        # Merchant area.
        main:
            lazy: true
            provider: app_users
            context: main
            user_checker: App\Security\ActiveUserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: app_dashboard
                enable_csrf: true
            logout:
                path: app_logout
                target: app_login
                invalidate_session: false

    access_control:
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/mcp, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/admin/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_SUPER_ADMIN }
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: '^/r/', roles: PUBLIC_ACCESS }
        # Merchant access is decided by membership rows, not a global role.
        - { path: ^/app, roles: ROLE_USER }
        # "Add to Signal" deep links: login first, then bounce back to the link.
        - { path: ^/add, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
