# Ingress for signal.yusufdgn.com.
#
# The app itself runs under docker compose on the host; the cluster only routes
# to it. A selector-less Service plus hand-written Endpoints point at the k3s
# bridge address, where docker publishes nginx (see HTTP_BIND in deploy/prod.env).
#
#   kubectl apply -f deploy/k8s/signal.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: signal
---
apiVersion: v1
kind: Service
metadata:
  name: signal
  namespace: signal
spec:
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8090
---
apiVersion: v1
kind: Endpoints
metadata:
  name: signal
  namespace: signal
subsets:
  - addresses:
      - ip: 10.42.0.1
    ports:
      - name: http
        port: 8090
        protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: signal
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: signal
  namespace: signal
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: signal-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - signal.yusufdgn.com
      secretName: signal-tls
  rules:
    - host: signal.yusufdgn.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: signal
                port:
                  number: 80
